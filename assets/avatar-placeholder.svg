<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Avatar placeholder">
  <defs>
    <linearGradient id="aBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#101B33"/>
    </linearGradient>

    <linearGradient id="aRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#22D3EE"/>
      <stop offset="50%"  stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="aFig" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.35"/>
    </linearGradient>

    <filter id="aGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="hexClip">
      <path d="M200,22 L350,110 L350,290 L200,378 L50,290 L50,110 Z"/>
    </clipPath>

    <pattern id="aGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#22D3EE" stroke-width="0.5" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- hex panel -->
  <g clip-path="url(#hexClip)">
    <rect width="400" height="400" fill="url(#aBg)"/>
    <rect width="400" height="400" fill="url(#aGrid)"/>

    <!-- wireframe figure -->
    <g filter="url(#aGlow)" opacity="0.9">
      <circle cx="200" cy="158" r="46" fill="none" stroke="url(#aFig)" stroke-width="2.2"/>
      <path d="M118,318 C118,246 158,214 200,214 C242,214 282,246 282,318"
            fill="none" stroke="url(#aFig)" stroke-width="2.2"/>
      <path d="M160,150 L240,150 M174,176 L226,176" stroke="#22D3EE" stroke-width="1" opacity="0.35"/>
    </g>

    <!-- scanline -->
    <rect x="0" y="0" width="400" height="3" fill="#22D3EE" opacity="0.5" filter="url(#aGlow)">
      <animate attributeName="y" values="20;380;20" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- label -->
    <text x="200" y="356" text-anchor="middle"
          font-family="'JetBrains Mono','Fira Code',monospace" font-size="11"
          letter-spacing="3" fill="#475569">PHOTO&#160;PLACEHOLDER</text>
  </g>

  <!-- hex border -->
  <path d="M200,22 L350,110 L350,290 L200,378 L50,290 L50,110 Z"
        fill="none" stroke="url(#aRing)" stroke-width="2.6" filter="url(#aGlow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3.6s" repeatCount="indefinite"/>
  </path>

  <!-- rotating dashed ring -->
  <circle cx="200" cy="200" r="186" fill="none" stroke="url(#aRing)"
          stroke-width="1.2" stroke-dasharray="4 14" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 200 200" to="360 200 200" dur="26s" repeatCount="indefinite"/>
  </circle>

  <!-- orbiting node -->
  <circle r="5" fill="#A5F3FC" filter="url(#aGlow)">
    <animateMotion dur="11s" repeatCount="indefinite"
                   path="M200,200 m-186,0 a186,186 0 1,0 372,0 a186,186 0 1,0 -372,0"/>
  </circle>

  <!-- corner ticks -->
  <g stroke="#22D3EE" stroke-width="2" fill="none" opacity="0.7">
    <path d="M50,96 L50,110 L64,102"/>
    <path d="M350,96 L350,110 L336,102"/>
    <path d="M50,304 L50,290 L64,298"/>
    <path d="M350,304 L350,290 L336,298"/>
  </g>
</svg>
